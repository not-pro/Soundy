[package]
name = "soundy"
version = "1.9.0"
edition = "2024"
rust-version = "1.85"
description = "Keyboard and mouse sounds for macOS and Windows"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSUserDefaults", "NSNotification", "NSTimer", "NSLocale", "NSArray", "NSError", "NSBundle"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSCell", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSButtonCell", "NSControl", "NSResponder", "NSView", "NSAlert", "NSWorkspace", "NSImage", "NSAccessibilityProtocols", "NSWindow", "NSWindowRestoration", "NSGraphics", "NSVisualEffectView", "NSPopUpButton", "NSPopUpButtonCell", "NSMenuItemCell", "NSTextField", "NSFont", "NSColor", "NSBezierPath", "NSImageView", "NSAppearance", "NSSlider", "NSSliderCell", "NSActionCell", "NSText", "NSAccessibilityConstants", "NSPopover", "NSViewController", "objc2-core-foundation"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioMixerNode", "AVAudioFile", "AVAudioBuffer", "AVAudioPlayerNode", "AVAudioMixing", "AVAudioFormat", "AVAudioTime", "AVAudioTypes", "AVAudioUnit", "AVAudioUnitEffect", "objc2-audio-toolbox", "block2"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AudioComponent"] }

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = "symbols"
