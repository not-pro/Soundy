name: macOS

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      RUSTUP_TOOLCHAIN: stable
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Check version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --locked --offline --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match Cargo.toml version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --offline
      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(uname -m)" = "$ARCH"
          sh scripts/bundle.sh
          lipo dist/Soundy.app/Contents/MacOS/soundy -verify_arch "$ARCH"
          dist/Soundy.app/Contents/MacOS/soundy --version
          dist/Soundy.app/Contents/MacOS/soundy --check
          cd dist
          archive="Soundy-v${VERSION}-macos-${ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent Soundy.app "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Soundy-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Soundy-macos-*
          merge-multiple: true
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd artifacts
          sha256sum --check *.sha256
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" *.zip *.sha256 \
            --verify-tag --generate-notes --title "Soundy $GITHUB_REF_NAME" \
            --notes "Keyboard and mouse sounds for macOS 13+. Includes all 240 WAV files, 40 keyboard profiles and 15 mouse sound pairs. Choose arm64 for Apple Silicon or x86_64 for Intel. The app has an ad-hoc signature and is not notarized." \
            "${options[@]}"
